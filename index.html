<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Nido · Diseñá tu depto en 2D y 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7eaed;--panel:#f8f9fa;--ink:#16202b;--mut:#6b7785;--line:#dde2e7;--acc:#3a4dff;--accS:#e6e9ff;--teal:#0e9f8e;--tile:#eceff2;
--fd:'Syne','Trebuchet MS',system-ui,sans-serif;--fb:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:304px 1fr 288px;grid-template-rows:54px 1fr;height:100vh;height:100dvh}
#top{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px 9px 9px 2px;background:var(--ink);display:grid;place-items:center}
.logo i{display:block;width:12px;height:12px;border:2.5px solid #fff;border-radius:2px 2px 2px 0}
.brand b{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.02em}
#ver{font-size:11px;color:var(--mut);font-weight:600;background:var(--tile);border-radius:999px;padding:2px 8px}
#pname{border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px;width:170px;font-weight:600}
#pname:hover,#pname:focus{border-color:var(--line);background:#fff}
.seg{display:flex;background:var(--tile);border-radius:10px;padding:3px;margin:0 auto}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.15)}
.tb{display:flex;gap:6px;align-items:center}
.ib{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-weight:600;font-size:13px}
.ib:hover{border-color:#b9c1cb}.ib:disabled{opacity:.4;cursor:default}
.ib.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.mob{display:none}
#left,#right{background:var(--panel);min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line);overflow-y:auto}
.search{padding:12px 12px 8px}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}
#cats{display:flex;gap:6px;padding:2px 12px 10px;overflow-x:auto;scrollbar-width:thin;flex:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;white-space:nowrap;font-size:12.5px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#grid{flex:1;overflow-y:auto;padding:4px 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.cat-h{grid-column:1/3;font-family:var(--fd);font-weight:700;font-size:13px;margin:10px 0 0;color:var(--ink)}
.it{cursor:pointer;user-select:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;text-align:left;position:relative;display:flex;flex-direction:column;gap:4px}
.it:hover{border-color:var(--acc)}
.it img{width:100%;aspect-ratio:1;background:var(--tile);border-radius:7px;display:block;pointer-events:none}
.it span{font-size:12.5px;font-weight:600;line-height:1.2}.it small{color:var(--mut);font-size:11.5px}
.it .x{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:14px;line-height:1;color:var(--mut)}
.leftfoot{padding:10px 12px;border-top:1px solid var(--line)}
.leftfoot .ib{width:100%;justify-content:center}
#stage{position:relative;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c3d{display:none}
#tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 28px rgba(20,30,50,.12);z-index:3}
#tools button{width:38px;height:38px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
#tools button:hover{background:var(--tile)}#tools button.on{background:var(--acc);color:#fff}
#tools hr{border:0;border-top:1px solid var(--line);margin:4px 6px;width:auto}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:12.5px;z-index:3;max-width:90%;text-align:center;pointer-events:none}
#status{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.85);border-radius:8px;padding:4px 9px;z-index:3;pointer-events:none}
#hud3{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;gap:6px;z-index:3;flex-wrap:wrap;justify-content:center;max-width:94%}
select.ib{padding:7px 8px}
#joy{display:none;position:absolute;left:22px;bottom:58px;width:132px;height:132px;border-radius:50%;background:rgba(22,32,43,.28);border:2px solid rgba(255,255,255,.75);z-index:4;touch-action:none;user-select:none}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none}
#banner{display:none;position:absolute;top:0;left:0;right:0;min-height:44px;background:var(--ink);color:#fff;align-items:center;justify-content:center;gap:10px;font-size:13px;z-index:4;padding:6px 10px;flex-wrap:wrap;text-align:center}
#banner.on{display:flex}#banner .ib{padding:5px 10px;font-size:12.5px}
#stage.hasBanner #tools,#stage.hasBanner #hud3{top:58px}
.linkbox{display:flex;gap:6px}.linkbox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;background:#fff}
details summary{cursor:pointer;font-weight:600;font-size:13px}
pre.rules{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11.5px;overflow:auto;margin:0;user-select:all}
code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
#hud3 .ib{box-shadow:0 8px 28px rgba(20,30,50,.12)}
#props{padding:14px}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ph img{width:52px;height:52px;background:var(--tile);border-radius:9px}
.pn{flex:1;min-width:0}.pn small{color:var(--mut)}
.ttl{width:100%;border:1px solid transparent;background:transparent;font-family:var(--fd);font-weight:700;font-size:16px;padding:3px 5px;margin-left:-5px;border-radius:7px}
.ttl:hover,.ttl:focus{border-color:var(--line);background:#fff}
.grp{padding:12px 0;border-top:1px solid var(--line)}
.grp h4{margin:0 0 8px;font-size:12.5px;font-weight:700}.grp h4 em{font-style:normal;color:var(--mut);font-weight:500}
.g2,.g3{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11.5px;color:var(--mut)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;min-width:0}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw1{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw input[type=color]{width:30px;height:28px;padding:0;border:0;background:none}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts .ib{padding:6px 9px;font-size:12.5px}
.ib.dng{color:#c0392b}
.note{color:var(--mut);font-size:12.5px;line-height:1.45;margin:0}
.big{font-family:var(--fd);font-weight:800;font-size:24px;letter-spacing:-.02em}
.tip{background:var(--accS);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-top:10px}
input[type=range]{width:100%}
#modal{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#mcard{background:var(--panel);border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
#mcard h3{font-family:var(--fd);font-weight:800;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
#mcard .sub{color:var(--mut);margin:0 0 14px;line-height:1.45}
#mcard .fld{margin-bottom:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.filebtns{display:grid;gap:8px}.filebtns .ib{justify-content:flex-start;padding:12px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px}
.cprev{display:flex;gap:12px;align-items:center;margin-bottom:12px}.cprev canvas{position:static;width:96px;height:96px;background:var(--tile);border-radius:10px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:60;display:none;max-width:90%;font-size:13px}
@media(max-width:900px){
 #app{grid-template-columns:1fr;grid-template-rows:52px 1fr}#top{grid-column:1;gap:8px;padding:0 8px}
 #pname,.brand b,#ver,.ib .t{display:none}.mob{display:inline-flex}
 #left,#right{position:fixed;top:52px;bottom:0;width:min(330px,88vw);z-index:20;display:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
 #left{left:0}#right{right:0}#left.open,#right.open{display:flex}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
<header id="top">
 <div class="brand"><div class="logo"><i></i></div><b>Nido</b><small id="ver" title="Versión">v1.4 · 19 sep</small></div>
 <input id="pname" aria-label="Nombre del proyecto" value="Mi depto">
 <button class="ib mob" id="btnL" title="Catálogo"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v4H4zM14 15h6v4h-6z"/></svg></button>
 <div class="seg" id="viewSeg"><button data-v="3d" class="on">3D</button><button data-v="2d">Plano 2D</button><button data-v="walk">Recorrer</button></div>
 <div class="tb">
  <button class="ib" id="bUndo" title="Deshacer (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="ib" id="bRedo" title="Rehacer (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
  <button class="ib" id="bList"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="t">Lista</span></button>
  <button class="ib pri" id="bShare"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 13v6a1 1 0 001 1h12a1 1 0 001-1v-6"/></svg><span class="t">Compartir</span></button>
  <button class="ib" id="bFile"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h10l6 6v10H4z"/><path d="M14 4v6h6"/></svg><span class="t">Archivo</span></button>
  <button class="ib" id="bHelp" title="Ayuda">?</button>
  <button class="ib mob" id="btnR" title="Propiedades"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
 </div>
</header>
<aside id="left">
 <div class="search"><input id="q" type="search" placeholder="Buscar: sillón, heladera, inodoro…"></div>
 <div id="cats"></div>
 <div id="grid"></div>
 <div class="leftfoot"><button class="ib" id="bCustom"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Mueble a medida o con foto</button></div>
</aside>
<main id="stage">
 <canvas id="c2d"></canvas><canvas id="c3d"></canvas>
 <div id="tools">
  <button data-tool="select" class="on" title="Seleccionar (V)"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
  <button data-tool="wall" title="Dibujar pared (W)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M8 8v8M13 8v8M18 8v8"/></svg></button>
  <button data-tool="room" title="Ambiente / piso (H)"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2.5"/><path d="M9 12h6M12 9v6"/></svg></button>
  <button data-tool="measure" title="Medir distancia (M)"><svg class="i" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg></button>
  <hr>
  <button id="tFit" title="Ajustar vista (F)"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="tDims" class="on" title="Mostrar cotas"><svg class="i" viewBox="0 0 24 24"><path d="M3 8v8M21 8v8M3 12h18M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
  <button id="tGrid" class="on" title="Grilla"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 12h16M12 4v16"/></svg></button>
  <button id="tSnap" class="on" title="Imán: ajusta a 5 cm y 15° (mantené Alt para desactivar)"><svg class="i" viewBox="0 0 24 24"><path d="M6 3v9a6 6 0 0012 0V3h-4v9a2 2 0 01-4 0V3z"/></svg></button>
 </div>
 <div id="banner"><span id="bannerTxt"></span><button class="ib" id="bannerAdopt">Guardar como mi proyecto</button><button class="ib" id="bannerClose" aria-label="Cerrar aviso">✕</button></div>
 <div id="hud3"></div>
 <div id="joy" aria-label="Joystick de movimiento"><div id="joyKnob"></div></div>
 <div id="hint"></div>
 <div id="status"></div>
</main>
<aside id="right"><div id="props"></div></aside>
</div>
<div id="modal"><div id="mcard"></div></div>
<div id="toast"></div>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const R1=v=>Math.round(v*10)/10,R2=v=>Math.round(v*100)/100;
const fl=v=>v>=100?(v/100).toFixed(2).replace('.',',')+' m':Math.round(v)+' cm';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FONT="'Hanken Grotesk',system-ui,sans-serif";
const ACC='#3a4dff',TEAL='#0e9f8e';
const ICON={
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',rot:'<path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/>',
 flip:'<path d="M12 3v18M8 7L3 12l5 5zM16 7l5 5-5 5z"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>',
 wall:'<path d="M3 12h18M3 12l3-3M3 12l3 3"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}
const SHC={};
function shade(h,f){const k=h+f;if(SHC[k])return SHC[k];const[r,g,b]=hex2rgb(h);return SHC[k]=f<=1?rgb2hex(r*f,g*f,b*f):rgb2hex(r+(255-r)*(f-1),g+(255-g)*(f-1),b+(255-b)*(f-1));}
function col(c,base){if(c==='M')return base;if(c==='D')return shade(base,.74);if(c==='L')return shade(base,1.16);return c;}
function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms);}

/* ================= catálogo ================= */
const DEF={},DL=[];
const CATS=[['Living','🛋️'],['Dormitorio','🛏️'],['Comedor','🍽️'],['Cocina','🍳'],['Baño','🚿'],['Oficina','🖥️'],['Entrada','🚪'],['Aberturas','🪟'],['Paredes y deco','🖼️'],['Alfombras','🧶'],['Exterior','🌿'],['A medida','✏️']];
function add(id,cat,name,w,d,h,color,build,o){const x=Object.assign({id,cat,name,w,d,h,color,build},o||{});DEF[id]=x;DL.push(x);}
const B=(x0,y0,z0,x1,y1,z1,c,a,e)=>Object.assign({k:'b',v:[x0,y0,z0,x1,y1,z1],c:c||'M',a:a==null?1:a},e);
const C=(cx,cy,z0,z1,rx,ry,c,a,e)=>Object.assign({k:'c',v:[cx,cy,z0,z1,rx,ry],c:c||'M',a:a==null?1:a},e);
const D=(cx,cz,y0,y1,r,c,a,e)=>Object.assign({k:'d',v:[cx,cz,y0,y1,r],c:c||'M',a:a==null?1:a},e);
const legs=(w,d,lh,s,c,i)=>{i=i==null?3:i;const hw=w/2-i,hd=d/2-i;return[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>B(a*hw-s/2,b*hd-s/2,0,a*hw+s/2,b*hd+s/2,lh,c));};
const seams=(w,d,n,z0,z1,c)=>{const P=[],hw=w/2,hd=d/2;for(let i=1;i<n;i++){const x=-hw+i*w/n;P.push(B(x-.5,hd-1,z0,x+.5,hd,z1,c||'#3a342e'));}return P;};
const handles=(w,d,n,z,c)=>{const P=[],hw=w/2,hd=d/2;for(let i=0;i<n;i++){const x=-hw+(i+.5)*w/n;const o=w/n*.35*(i%2?-1:1);P.push(B(x+o-1,hd-2.5,z,x+o+1,hd,z+10,c||'#c9ced3'));}return P;};
const SEATS=d=>[{k:'seats',l:'Asientos',min:1,max:6,def:d}];
const WOOD='#c9a27a',DWOOD='#7a5a3e',WHT='#f1f0ec',STL='#cfd3d6',DK='#2a2c30',GLS='#bfe1ee';

/* ---- living ---- */
const sofaB=(w,d,h,o)=>{const n=Math.max(1,o.seats||2),hw=w/2,hd=d/2,arm=Math.min(18,w*.14),bk=Math.min(24,d*.28),sh=Math.round(h*.52),P=legs(w,d,8,6,'#2f2a26',4);

function updHint(){$('#hint').textContent=mode==='2d'?HINTS[tool]:mode==='3d'?'Clic en un mueble para elegirlo y arrastrarlo · arrastrá el fondo para girar la vista':'Caminá con W A S D · arrastrá para mirar · Shift corre · Esc para salir';}

 if(mode==='walk'){keys[k]=1;if(e.key==='Escape')setMode('3d');return;}
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return;}
 if((e.ctrlKey||e.metaKey)&&k==='d'){e.preventDefault();dupSel();return;}
 if(drawing&&tool==='wall'){if(/^[0-9.,]$/.test(e.key)){numBuf+=e.key==='.'?',':e.key;redraw();return;}if(e.key==='Backspace'&&numBuf){numBuf=numBuf.slice(0,-1);redraw();e.preventDefault();return;}
  if(e.key==='Enter'){if(numBuf){const L=parseFloat(numBuf.replace(',','.')),a=drawing.last,m=snapPt(mouse.x,mouse.y,a,true),ang=Math.atan2(m.y-a.y,m.x-a.x),st=rad(15),ang2=snapOn?Math.round(ang/st)*st:ang;if(L>0)addWallTo({x:R2(a.x+Math.cos(ang2)*L),y:R2(a.y+Math.sin(ang2)*L)});numBuf='';}else drawing=null;redraw();return;}}
 if(e.key==='Enter'&&tool==='room')finishRoomPoly();
 if(e.key==='Escape'){if(drawing||rdraw||meas||numBuf){drawing=null;rdraw=null;meas=null;numBuf='';redraw();}else if(tool!=='select')setTool('select');else select(null);return;}
 if(e.key==='Delete'||e.key==='Backspace'){delSel();e.preventDefault();return;}
 if(k===' '){space=true;e.preventDefault();return;}
 if(mode==='2d'){if(k==='v')setTool('select');else if(k==='w')setTool('wall');else if(k==='h')setTool('room');else if(k==='m')setTool('measure');else if(k==='f')fit();}if(k==='r')rotateSel(90);
 if(e.key.startsWith('Arrow')){const s=getSel();if(!s||sel.k!=='item')return;e.preventDefault();const st=e.shiftKey?10:1;if(e.key==='ArrowLeft')s.x-=st;if(e.key==='ArrowRight')s.x+=st;if(e.key==='ArrowUp')s.y-=st;if(e.key==='ArrowDown')s.y+=st;syncProps();commit();}});

 if(!s){h=projectHTML();}
 else if(sel.k==='item'){const df=DEF[s.t],ps=(df.params||[]).map(p=>`<label class="fld"><span>${p.l}</span><input type="number" data-p="${p.k}" min="${p.min}" max="${p.max}" value="${s.p&&s.p[p.k]!=null?s.p[p.k]:p.def}"></label>`).join('');

  <div class="grp"><h4>Color</h4><div class="sw">${SW.map(c=>`<button class="sw1" data-color="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}<input type="color" data-k="color" value="${s.color}"></div></div>
  <div class="grp acts"><button class="ib" data-act="rot">${ic('rot')}Girar 90°</button><button class="ib" data-act="fx">${ic('flip')}Espejar</button>${df.ex?'<button class="ib" data-act="fy">Invertir apertura</button>':''}<button class="ib" data-act="wall">${ic('wall')}Pegar a pared</button>${s.t==='foto'?`<button class="ib" data-act="photo">${ic('img')}Cambiar foto</button>`:''}<button class="ib" data-act="dup">${ic('copy')}Duplicar</button><button class="ib dng" data-act="del">${ic('trash')}Eliminar</button></div>
  ${df.open?'<p class="note">Arrastrala sobre una pared y se encaja sola. Con “Invertir apertura” elegís hacia qué lado abre.</p>':''}`;}
 else if(sel.k==='wall'){const L=Math.hypot(s.x2-s.x1,s.y2-s.y1);h=`<div class="ph"><div class="pn"><div class="ttl" style="font-family:var(--fd);font-weight:700;font-size:16px">Pared</div><small>visible: ${fl(L-wallEnds(s).e1-wallEnds(s).e2)}</small></div></div>
  <div class="grp"><div class="g2">${fld('Largo al eje (cm)','len',R1(L),'min="5"')}${fld('Espesor (cm)','t',R1(s.t),'min="2"')}${fld('Alto (cm)','h',R1(s.h))}<label class="fld"><span>Color</span><input type="color" data-k="c" value="${s.c||'#f1ede6'}"></label></div></div>
  <div class="grp acts"><button class="ib dng" data-act="del">${ic('trash')}Eliminar</button></div><p class="note">Arrastrá los círculos de las puntas para mover la pared: las que están unidas se mueven juntas.</p>`;}
 else{h=`<div class="ph"><div class="pn"><input class="ttl" data-k="name" value="${esc(s.name)}"><small>Ambiente</small></div></div>
  <div class="grp"><div class="g2"><label class="fld"><span>Piso</span><select data-k="mat">${Object.entries(FLOORS).map(([k,f])=>`<option value="${k}" ${s.mat===k?'selected':''}>${f.n}</option>`).join('')}</select></label>
  <label class="fld"><span>Color (piso liso)</span><input type="color" data-k="color" value="${s.color||'#efe9df'}"></label></div></div>
  <div class="grp"><div class="big" id="rArea">${(polyArea(s.pts)/1e4).toFixed(2).replace('.',',')} m²</div><p class="note" id="rPer">Perímetro ${fl(s.pts.reduce((a,p,i)=>{const q=s.pts[(i+1)%s.pts.length];return a+Math.hypot(q[0]-p[0],q[1]-p[1]);},0))}</p></div>
  <div class="grp acts"><button class="ib dng" data-act="del">${ic('trash')}Eliminar</button></div><p class="note">Arrastrá los círculos de las esquinas para ajustar el ambiente.</p>`;}
 if(!s&&tool==='wall')h=`<div class="grp" style="border:0;padding-top:0"><h4>Herramienta pared</h4><div class="g2">${fld('Espesor (cm)','oT',opts.wallT,'min="2"')}${fld('Alto (cm)','oH',S.meta.wallH)}</div><p class="note" style="margin-top:8px">Empezá a dibujar en el plano. Mientras dibujás podés escribir el largo exacto y apretar Enter.</p></div>`+h;
 if(!s&&tool==='room')h=`<div class="grp" style="border:0;padding-top:0"><h4>Herramienta ambiente</h4><div class="acts"><button class="ib ${opts.roomMode==='rect'?'pri':''}" data-act="rm-rect">Rectángulo</button><button class="ib ${opts.roomMode==='poly'?'pri':''}" data-act="rm-poly">Polígono</button></div>
  <h4 style="margin-top:14px">Agregar con paredes <em>medidas interiores</em></h4><div class="g2">${fld('Ancho (cm)','qW',400)}${fld('Largo (cm)','qL',300)}</div><div class="acts" style="margin-top:8px"><button class="ib pri" data-act="quickroom">Agregar ambiente</button></div></div>`+h;
 P.innerHTML=h;}
function projectHTML(){const area=S.rooms.reduce((a,r)=>a+polyArea(r.pts),0)/1e4;return`<div class="ph"><div class="pn"><div class="ttl" style="font-family:var(--fd);font-weight:800;font-size:18px">Proyecto</div><small>${esc(S.meta.name)}</small></div></div>
 <div class="grp" style="border:0;padding-top:0"><div class="big">${area.toFixed(1).replace('.',',')} m²</div><p class="note">${S.rooms.length} ambiente(s) · ${S.walls.length} pared(es) · ${S.items.length} objeto(s)</p></div>
 <div class="grp"><h4>Altura de paredes <em>cm</em></h4><div class="g2">${fld('Para paredes nuevas','oH',S.meta.wallH)}<label class="fld"><span>&nbsp;</span><button class="ib" data-act="allH">Aplicar a todas</button></label></div></div>
 <div class="grp"><h4>Plano de fondo <em>para calcar</em></h4><div class="acts"><button class="ib" data-act="bgload">${ic('img')}${BG?'Cambiar':'Cargar imagen'}</button>${BG?'<button class="ib dng" data-act="bgdel">Quitar</button>':''}</div>
 ${BG?`<div class="g2" style="margin-top:8px"><label class="fld"><span>Ancho real (cm)</span><input type="number" data-bg="w" value="${R1(BG.w)}"></label><label class="fld"><span>Opacidad</span><input type="range" data-bg="op" min="0.1" max="1" step="0.05" value="${BG.op}"></label><label class="fld"><span>Posición X</span><input type="number" data-bg="x" value="${R1(BG.x)}"></label><label class="fld"><span>Posición Y</span><input type="number" data-bg="y" value="${R1(BG.y)}"></label></div>`:'<p class="note" style="margin-top:8px">Subí el plano de la inmobiliaria y calcá encima. Después ajustá el ancho real con la herramienta Medir.</p>'}</div>
 <div class="tip"><b>Cómo empezar</b><br>1. Dibujá paredes (W) o creá un ambiente con medidas exactas.<br>2. Arrastrá muebles del catálogo al plano.<br>3. Seleccioná uno para ver a cuánto está de cada pared.<br>4. Mirá cómo queda en 3D o caminá adentro.</div>`;}
function syncProps(){const s=getSel();if(!s)return;$$('#props [data-k]').forEach(el=>{if(document.activeElement===el)return;const k=el.dataset.k;let v=k==='len'?Math.hypot(s.x2-s.x1,s.y2-s.y1):s[k];if(v==null)return;el.value=el.type==='number'?R1(v):v;});
 if(sel.k==='room'){const a=$('#rArea');if(a)a.textContent=(polyArea(s.pts)/1e4).toFixed(2).replace('.',',')+' m²';}}
function applyField(el,fin){const k=el.dataset.k,pk=el.dataset.p,bk=el.dataset.bg;let v=el.type==='number'||el.type==='range'?parseFloat(el.value):el.value;
 if(bk){if(!BG||isNaN(v))return;BG[bk]=v;redraw();if(fin)persist();return;}
 if(k==='oT'){if(v>=2)opts.wallT=v;return;}if(k==='oH'){if(v>=50)S.meta.wallH=v;return;}if(k==='qW'||k==='qL')return;
 const s=getSel();if(!s)return;if(typeof v==='number'&&isNaN(v))return;
 if(pk){s.p=s.p||{};s.p[pk]=clamp(Math.round(v),+el.min||0,+el.max||99);}
 else if(k==='len'){if(v>=5){const L=Math.hypot(s.x2-s.x1,s.y2-s.y1)||1,nx=s.x1+(s.x2-s.x1)/L*v,ny=s.y1+(s.y2-s.y1)/L*v;linked(s.x2,s.y2,s).forEach(([w,e])=>setEnd(w,e,nx,ny));s.x2=nx;s.y2=ny;}}
 else if(['w','d','h'].includes(k)&&sel.k==='item'){if(v>0)s[k]=v;}
 else if(k==='r'){s.r=((v%360)+360)%360;}
 else s[k]=v;
 redraw();if(fin){commit();if(sel.k==='room')buildProps();}}
P.addEventListener('input',e=>{const el=e.target;if(el.dataset.k||el.dataset.p||el.dataset.bg)applyField(el,false);});
P.addEventListener('change',e=>{const el=e.target;if(el.dataset.k||el.dataset.p||el.dataset.bg){applyField(el,true);if(el.dataset.p)buildProps();}});
P.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=getSel();
 if(b.dataset.color&&s){s.color=b.dataset.color;buildProps();commit();return;}
 switch(b.dataset.act){case'rot':rotateSel(90);break;case'fx':if(s){s.fx=s.fx?0:1;commit();}break;case'fy':if(s){s.fy=s.fy?0:1;commit();}break;
  case'wall':if(s){if(!trySnapWall(s,s,DEF[s.t].open?'open':'face',1e6))toast('Primero dibujá una pared.');else{syncProps();commit();}}break;
  case'dup':dupSel();break;case'del':delSel();break;case'photo':pickImage(src=>{s.photo=src;commit();});break;
  case'rm-rect':opts.roomMode='rect';buildProps();break;case'rm-poly':opts.roomMode='poly';buildProps();break;
  case'quickroom':{const W=parseFloat($('[data-k=qW]').value),L=parseFloat($('[data-k=qL]').value);if(W>=50&&L>=50){const r=view,st=c2.getBoundingClientRect(),cx=(st.width/2-r.x)/r.z-W/2,cy=(st.height/2-r.y)/r.z-L/2;const room=addRoomRect(Math.round(cx/5)*5,Math.round(cy/5)*5,W,L,opts.wallT,'Ambiente '+(S.rooms.length+1));commit();select('room',room);}break;}
  case'allH':S.walls.forEach(w=>w.h=S.meta.wallH);commit();toast('Altura aplicada a todas las paredes.');break;
  case'bgload':pickImage(src=>{const im=new Image();im.onload=()=>{BG={src,img:im,x:0,y:0,w:800,op:.5};persist();buildProps();redraw();};im.src=src;},1600,.8);break;

function card(key,name,dims,src,x){return`<div class="it" role="button" tabindex="0" draggable="true" data-key="${key}"><img src="${src}" alt=""><span>${esc(name)}</span><small>${dims}</small>${x?`<span class="x" data-del="${key}" role="button" title="Quitar">×</span>`:''}</div>`;}
function buildGrid(){const q=query.trim().toLowerCase();let h='';const cats=catSel==='Todos'?CATS.map(c=>c[0]):[catSel];
 if(catSel==='Todos'||catSel==='Mis muebles'){const cs=custom.filter(c=>!q||c.name.toLowerCase().includes(q));if(cs.length){if(catSel==='Todos')h+='<div class="cat-h">Mis muebles</div>';h+=cs.map(c=>{const cv=document.createElement('canvas');cv.width=cv.height=176;thumbItem(Object.assign({p:{}},c),cv);return card('cust:'+c.pid,c.name,`${R1(c.w)}×${R1(c.d)}×${R1(c.h)}`,cv.toDataURL(),1);}).join('');}}
 if(catSel!=='Mis muebles')for(const cat of cats){const ds=DL.filter(d=>d.cat===cat&&(!q||d.name.toLowerCase().includes(q)||cat.toLowerCase().includes(q)));if(!ds.length)continue;if(catSel==='Todos')h+=`<div class="cat-h">${cat}</div>`;h+=ds.map(d=>card('def:'+d.id,d.name,`${d.w}×${d.d}×${d.h} cm`,thumbOf(d.id))).join('');}
 $('#grid').innerHTML=h||'<p class="note" style="grid-column:1/3;padding:8px">No encontré nada con esa búsqueda. Probá con “mesa”, “sillón” o “ventana”.</p>';}

function spawnPos(){if(mode==='3d')return{x:orb.tx,y:orb.tz};if(mode==='walk')return{x:walk.x+Math.sin(walk.yaw)*250,y:walk.z+Math.cos(walk.yaw)*250};return viewCenter();}

 const df=DEF[it.t];if(!pos){pos=spawnPos();pos.x+=(S.items.length%6)*18;pos.y+=(S.items.length%6)*18;}it.x=Math.round(pos.x);it.y=Math.round(pos.y);
 let sn=false;if(df.open)sn=trySnapWall(it,it,'open',70);else if(df.wm)sn=trySnapWall(it,it,'face',60);S.items.push(it);commit();select('item',it);
 if(it.t==='foto'&&!it.photo)pickImage(src=>{it.photo=src;commit();});
 if((df.open||df.wm)&&!sn)toast(df.open?'Arrastrala hasta una pared para que se encaje.':'Arrastrala cerca de una pared para que se pegue.');}
